    <meta property="og:url" content="https://www.jonnathanospina.com/pages/blog/{{SLUG}}.html">

    <link rel="stylesheet" href="../../CSS/design-system.css">
    <style>
        .main-container {
            max-width: 760px;
            margin: 0 auto;
            padding: 7rem 2rem 5rem;
            position: relative;
            z-index: 10;
        }
        .post-header { margin-bottom: 3rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border); }
        .post-header-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: var(--accent);
            letter-spacing: 0.12em;
            margin-bottom: 1rem;
            display: flex;
            gap: 1.2rem;
            flex-wrap: wrap;
        }
        .post-header-meta .cat { color: var(--accent2); }
        .post-header h1 {
            font-size: clamp(1.6rem, 4vw, 2.6rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.25;
        }
        .post-content { color: var(--text); font-size: 0.97rem; line-height: 1.85; }
        .post-content h2 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.05rem;
            color: var(--accent);
            margin: 2.5rem 0 1rem;
            letter-spacing: 0.02em;
        }
        .post-content h3 { font-size: 1rem; margin: 2rem 0 0.8rem; color: var(--text); }
        .post-content p { margin-bottom: 1.2rem; color: var(--text-soft); }
        .post-content a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(110,231,247,0.3); }
        .post-content a:hover { border-bottom-color: var(--accent); }
        .post-content ul, .post-content ol { margin: 0 0 1.2rem 1.4rem; color: var(--text-soft); }
        .post-content li { margin-bottom: 0.4rem; }
        .post-content code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
            background: var(--elevated);
            border: 1px solid var(--border);
            padding: 0.1em 0.4em;
            color: var(--accent);
        }
        .post-content pre {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 1.2rem;
            overflow-x: auto;
            margin-bottom: 1.4rem;
        }
        .post-content pre code { background: none; border: none; padding: 0; color: var(--text-soft); font-size: 0.82rem; }
        .post-content blockquote {
            border-left: 3px solid var(--accent2);
            padding: 0.2rem 0 0.2rem 1.2rem;
            margin-bottom: 1.2rem;
            color: var(--muted);
        }
        .post-content table { border-collapse: collapse; margin-bottom: 1.4rem; width: 100%; font-size: 0.88rem; }
        .post-content th, .post-content td { border: 1px solid var(--border); padding: 0.5rem 0.8rem; text-align: left; }
        .post-content th { background: var(--surface); font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--accent); }
        .post-footer { margin-top: 4rem; padding-top: 2rem; border-top: 1px solid var(--border); }
        .back-link {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--muted);
            text-decoration: none;
            border: 1px solid var(--border);
            padding: 0.35rem 0.9rem;
            display: inline-block;
            transition: all 0.2s;
        }
        .back-link:hover { color: var(--accent); border-color: rgba(110, 231, 247, 0.3); }
        @media (max-width: 768px) { .main-container { padding: 6rem 1.2rem 4rem; } }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <header class="nav-container">

                <a href="../blog.html" class="nav-btn active" data-i18n="nav.blog">Blog</a>

        </nav>

    <main class="main-container">
        <header class="post-header">
            <div class="post-header-meta">
                <span>{{DATE}}</span>
                <span class="cat">{{CATEGORY}}</span>
                <span>~{{MINUTES}} min</span>

        </header>

        <article class="post-content">
{{CONTENT}}

        <footer class="post-footer">

            <div class="status-dot"></div>
            <span>online</span>
        </div>
        <div class="status-item">
            <span>Rule 30 · autómata celular</span>
        </div>
        <div class="status-item">
            <span id="current-time"></span>
        </div>
    </div>

    <!-- Analytics: crea la cuenta en https://www.goatcounter.com con el código "jonnathanospina" y descomenta -->
    <!-- <script data-goatcounter="https://jonnathanospina.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script> -->
    <script src="../../JS/i18n.js"></script>
    <script src="../../JS/theme.js"></script>
    <script>
    (function(){
        const canvas=document.getElementById('bg-canvas');
        const ctx=canvas.getContext('2d');
        let W,H,cols,rows,grid=[],row=0;
        const CELL=5,RULE=30;
        function result(l,c,r){return(RULE>>((l<<2)|(c<<1)|r))&1;}
        function init(){
            canvas.width=window.innerWidth;canvas.height=window.innerHeight;
            W=canvas.width;H=canvas.height;
            cols=Math.floor(W/CELL);rows=Math.floor(H/CELL);
            ctx.fillStyle='#0a0a0f';ctx.fillRect(0,0,W,H);
            grid=new Array(cols).fill(0);grid[Math.floor(cols/2)]=1;row=0;
        }
        function step(){
            if(row>=rows){ctx.fillStyle='rgba(10,10,15,0.06)';ctx.fillRect(0,0,W,H);grid=new Array(cols).fill(0);grid[Math.floor(cols/2)]=1;row=0;return;}
            const next=new Array(cols).fill(0);
            const y=row*CELL;
            for(let i=0;i<cols;i++){
                const l=grid[(i-1+cols)%cols],c=grid[i],r=grid[(i+1)%cols];
                next[i]=result(l,c,r);
                if(grid[i]===1){
                    const p=row/rows;
                    const rv=Math.round(110+(167-110)*p),gv=Math.round(231+(139-231)*p);
                    ctx.fillStyle=`rgba(${rv},${gv},247,0.18)`;
                    ctx.fillRect(i*CELL,y,CELL-0.5,CELL-0.5);
                }
            }
            grid=next;row++;
        }
        let last=0;
        function frame(ts){if(ts-last>22){step();last=ts;}requestAnimationFrame(frame);}
        window.addEventListener('resize',init);init();requestAnimationFrame(frame);
    })();
    function updateTime(){const el=document.getElementById('current-time');if(el)el.textContent=new Date().toLocaleTimeString('es-ES',{hour12:false,hour:'2-digit',minute:'2-digit'});}
    updateTime();setInterval(updateTime,60000);
    </script>
</body>
</html>
